<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse Bridge</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 14px; background: #0b0e14; color: #e8eaf0;
         font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  h1 .dot { color: #ff3b3b; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: #9aa3b2; margin: 18px 0 6px; }
  .sub { color: #9aa3b2; font-size: 12px; margin: 0 0 8px; }
  button { background: #ff3b3b; color: #fff; border: 0; border-radius: 8px;
           padding: 7px 12px; font-size: 13px; cursor: pointer; }
  button.ghost { background: #1a2030; color: #e8eaf0; border: 1px solid #2a3247; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 5px 0; }
  .card { background: #12172a; border: 1px solid #232b42; border-radius: 10px;
          padding: 10px 12px; margin: 8px 0; }
  .card .t { font-weight: 600; }
  .card .b { color: #c3cad8; font-size: 13px; white-space: pre-wrap; }
  textarea { width: 100%; box-sizing: border-box; min-height: 58px; resize: vertical;
             background: #0f1420; color: #e8eaf0; border: 1px solid #2a3247;
             border-radius: 8px; padding: 8px; font: inherit; }
  #status { font-size: 12.5px; color: #9aa3b2; min-height: 18px; margin-top: 6px; }
  #status.err { color: #ff8080; }
  a { color: #7db4ff; }
</style>
</head>
<body>
  <h1>Muse <span class="dot">Bridge</span></h1>
  <p class="sub">The shared folder where your two Muses exchange work.</p>

  <div class="row">
    <button id="refresh">↻ Refresh</button>
    <button id="copyPrompt" class="ghost">Copy “check the bridge” prompt</button>
    <button id="openOptions" class="ghost">Options</button>
  </div>
  <div id="status">Loading…</div>

  <h2>Open tasks</h2>
  <div id="tasks"><p class="sub">—</p></div>

  <h2>Add a task for either Muse</h2>
  <textarea id="newTask" placeholder="e.g. Dig the API of example.com and leave the endpoints in FINDINGS"></textarea>
  <div class="row"><button id="addTask">Add to bridge</button></div>

  <h2>Latest findings</h2>
  <div id="findings"><p class="sub">—</p></div>

  <p class="sub">Reading works without a token if the repo is public.
  Adding tasks needs a GitHub token saved in Options (it stays in this browser only).</p>

<script src="sidepanel.js"></script>
</body>
</html>
