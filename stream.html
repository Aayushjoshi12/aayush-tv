<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Stream — Aayush TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  body{margin:0;background:#0b0e14;color:#e8ecf1;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:8px 0 4px}
  .sub{color:#9aa7b8;font-size:14px;margin:0 0 12px}
  video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px}
  .status{margin-top:10px;font-size:14px;color:#9aa7b8}
  .status.err{color:#ff7a7a}
  .status.ok{color:#7be495}
  a{color:#7db8ff}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Live Stream</h1>
  <p class="sub" id="sub">Loading…</p>
  <video id="v" controls autoplay muted playsinline></video>
  <p class="status" id="status">Starting…</p>
  <p class="sub"><a href="index.html">← Back to Aayush TV</a></p>
</div>
<script>
(function(){
  const q = new URLSearchParams(location.search);
  const videoId = q.get('videoId') || q.get('id') || '';
  const directUrl = q.get('url') || '';
  const name = q.get('name') || q.get('title') || '';
  const video = document.getElementById('v');
  const statusEl = document.getElementById('status');
  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('sub');
  if (name) { titleEl.textContent = name; }
  function setStatus(msg, cls){ statusEl.textContent = msg; statusEl.className = 'status' + (cls ? ' ' + cls : ''); }
  function playUrl(url){
    subEl.textContent = videoId ? ('Video: ' + videoId) : 'Direct stream';
    // Prefer hls.js when it is available: Chrome on Windows reports
    // canPlayType('application/vnd.apple.mpegurl') === 'maybe' but
    // cannot actually play HLS natively, so the native branch would
    // sit at readyState 0 forever. Native playback is only the
    // fallback for Safari, which has real built-in HLS.
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({maxBufferLength: 30});
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function(){ video.play().catch(()=>{}); setStatus('Playing.', 'ok'); });
      hls.on(Hls.Events.ERROR, function(ev, data){
        if (data && data.fatal) setStatus('Stream error: ' + (data.details || data.type || 'unknown'), 'err');
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play().catch(()=>{});
      setStatus('Playing.', 'ok');
    } else {
      setStatus('HLS is not supported in this browser.', 'err');
    }
    video.addEventListener('playing', function(){ setStatus('Playing.', 'ok'); });
    video.addEventListener('waiting', function(){ setStatus('Buffering…'); });
    video.addEventListener('error', function(){ setStatus('Video error — the stream may have ended or the link expired.', 'err'); });
  }
  async function mint(videoId){
    setStatus('Getting the stream link…');
    const api = 'https://mret.aayushlife.live/cinema-api/stream-chrome?videoId=' + encodeURIComponent(videoId);
    let r, j;
    try {
      r = await fetch(api);
      j = await r.json().catch(()=>({}));
    } catch (e) {
      setStatus('Could not reach the stream service — check your connection and try again.', 'err');
      subEl.textContent = 'No stream is available for this match right now.';
      return;
    }
    if (!r.ok || !j.url) {
      const msg = (j && (j.detail || j.error)) ? (j.detail || j.error) : ('Could not get a stream link (HTTP ' + r.status + ').');
      setStatus(msg, 'err');
      subEl.textContent = 'No stream is available for this match right now.';
      return;
    }
    playUrl(j.url);
  }
  if (directUrl) {
    playUrl(directUrl);
  } else if (videoId) {
    mint(videoId);
  } else {
    setStatus('No match given. Open this page with ?videoId=DR_… or ?url=<m3u8>.', 'err');
    subEl.textContent = '';
  }
})();
</script>
</body>
</html>
